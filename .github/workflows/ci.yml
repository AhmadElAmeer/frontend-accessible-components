name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Unit tests (matching and highlighting)
        run: npm test

  browser:
    runs-on: ubuntu-latest
    env:
      REQUIRE_BROWSER: "1"
      REQUIRE_AXE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright, Chromium and axe-core
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Keyboard, model-based and accessibility tests
        run: npm run test:browser
